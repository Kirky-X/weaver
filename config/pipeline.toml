# Pipeline Configuration
# ============================================================
# News processing pipeline configuration
# Environment variables can override any value:
#   WEAVER__PIPELINE__PHASE1__CONCURRENCY=10
# ============================================================

version = "1.0"

# ============================================================
# Phase 1: Initial Processing
# ============================================================

[phase1]
concurrency = 5

[[phase1.stages]]
name = "classifier"
class_path = "modules.processing.pipeline.nodes.classifier.ClassifierNode"
enabled = true

[[phase1.stages]]
name = "cleaner"
class_path = "modules.processing.pipeline.nodes.cleaner.CleanerNode"
enabled = true

[[phase1.stages]]
name = "categorizer"
class_path = "modules.processing.pipeline.nodes.categorizer.CategorizerNode"
enabled = true

[[phase1.stages]]
name = "vectorize"
class_path = "modules.processing.pipeline.nodes.vectorize.VectorizeNode"
enabled = true

# ============================================================
# Phase 3: Deep Analysis
# ============================================================

[phase3]
concurrency = 5

[[phase3.stages]]
name = "re_vectorize"
class_path = "modules.processing.pipeline.nodes.re_vectorize.ReVectorizeNode"
enabled = true

[[phase3.stages]]
name = "analyze"
class_path = "modules.processing.pipeline.nodes.analyze.AnalyzeNode"
enabled = true

[[phase3.stages]]
name = "quality_scorer"
class_path = "modules.processing.pipeline.nodes.quality_scorer.QualityScorerNode"
enabled = true

[[phase3.stages]]
name = "credibility"
class_path = "modules.processing.pipeline.nodes.credibility_checker.CredibilityCheckerNode"
enabled = true

[[phase3.stages]]
name = "entity_extractor"
class_path = "modules.processing.pipeline.nodes.entity_extractor.EntityExtractorNode"
enabled = true

[[phase3.stages]]
name = "conflict_detector"
class_path = "modules.processing.nodes.quality.conflict_detector.ConflictDetectorNode"
enabled = true

[[phase3.stages]]
name = "narrative_generator"
class_path = "modules.processing.nodes.extraction.narrative_generator.NarrativeGeneratorNode"
enabled = true

[[phase3.stages]]
name = "schema_extractor"
class_path = "modules.processing.nodes.extraction.schema_extractor.SchemaExtractorNode"
enabled = true

[[phase3.stages]]
name = "sentiment_tracker"
class_path = "modules.processing.nodes.extraction.sentiment_tracker.SentimentTrackerNode"
enabled = true

# ============================================================
# Batch Processing
# ============================================================

[batch]
merger_class = "modules.processing.pipeline.nodes.batch_merger.BatchMergerNode"
enabled = true
timeout = 180

# ============================================================
# Monte Carlo Sampling Configuration
# ============================================================
# Monte Carlo evidence sampling for long documents (>10K characters)
# Uses multi-anchor strategy to extract relevant regions efficiently

[monte_carlo]
enabled = true
threshold = 10000  # Character threshold for MC sampling
sample_size = 5  # Number of regions to sample
region_size = 2000  # Characters per region
confidence_threshold = 0.4  # Fallback to full text if confidence < threshold