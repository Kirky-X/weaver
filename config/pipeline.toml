# Pipeline Configuration
# ============================================================
# News processing pipeline configuration
# Environment variables can override any value:
#   WEAVER__PIPELINE__PHASE1__CONCURRENCY=10
# ------------------------------------------------------------
# Consumed at runtime:
#   - [phase1].concurrency / [phase3].concurrency
#   - per-stage `enabled` flags (a false flag disables that stage;
#     only phase3 stages support disabling, see Pipeline disabled set)
#   - [monte_carlo] evidence sampling
#   - [phase3].merge_analyze_narrative (LLM call merge toggle)
#   - content_hash_version (config-driven snapshot invalidation)
# Stage node wiring is hard-coded in modules/processing/pipeline/graph.py
# (no dynamic class loading) — this file intentionally carries no
# class_path entries.
# ============================================================

version = "1.0"

# Content-hash 处理结果缓存版本。prompt/输出结构变更时 +1，旧快照立即
# 全部失效（否则 7 天 TTL 内新旧结果混杂）。本次 2→3：analyze_narrative
# 合并 prompt 上线 + narrative payload 移除 entities。
content_hash_version = 3

# ============================================================
# Phase 1: Initial Processing
# ============================================================

[phase1]
concurrency = 5

[[phase1.stages]]
name = "classifier"
enabled = true

[[phase1.stages]]
name = "cleaner"
enabled = true

[[phase1.stages]]
name = "categorizer"
enabled = true

[[phase1.stages]]
name = "vectorize"
enabled = true

# ============================================================
# Phase 3: Deep Analysis
# ============================================================

[phase3]
concurrency = 5
# analyze + narrative_schema 合并调用（LLM 调用优化：必调 chat 3→2 次/篇）。
# 回滚置 false 即可，无需改代码。注意：narrative_schema 阶段若被
# enabled=false 关闭，本开关应同时置 false。开启前建议先用最小评测集
# 对比合并前后的摘要与叙事抽取质量。
merge_analyze_narrative = true

[[phase3.stages]]
name = "re_vectorize"
enabled = true

[[phase3.stages]]
name = "analyze"
enabled = true

[[phase3.stages]]
name = "quality_scorer"
enabled = true

[[phase3.stages]]
name = "credibility"
enabled = true

[[phase3.stages]]
name = "entity_extractor"
enabled = true

[[phase3.stages]]
name = "fake_news_detector"
enabled = true

[[phase3.stages]]
name = "conflict_detector"
enabled = true

[[phase3.stages]]
name = "narrative_schema"
enabled = true

[[phase3.stages]]
name = "sentiment_tracker"
enabled = true

# BriefingGenerator is NOT registered here — it is an independent
# generator class invoked by scheduler (daily 08:00) + POST endpoint +
# service, not as a per-article pipeline node.

# ============================================================
# Monte Carlo Sampling Configuration
# ============================================================
# Monte Carlo evidence sampling for long documents (>10K characters)
# Uses multi-anchor strategy to extract relevant regions efficiently

[monte_carlo]
enabled = true
threshold = 10000  # Character threshold for MC sampling
sample_size = 5  # Number of regions to sample
region_size = 2000  # Characters per region
confidence_threshold = 0.4  # Fallback to full text if confidence < threshold
