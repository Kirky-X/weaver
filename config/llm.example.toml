# LLM Provider Configuration Template
# ============================================================
# Two-layer nested configuration: Provider + Model
# Copy this file to config/llm.toml and configure your providers.
# API keys are NOT read from ${VAR} placeholders in this file.
# Set them via environment variables: WEAVER_LLM__PROVIDERS__<NAME>__API_KEY
# (env > TOML). Leave api_key empty here when using env vars.
# ============================================================

# ============================================================
# Global Settings（LLMSettings 显式映射 [global] → 顶层字段，修改即生效）
# ============================================================
[global]
circuit_breaker_threshold = 5       # Consecutive failures before opening circuit
circuit_breaker_timeout = 60.0      # Cooldown period before half-open (seconds)
default_timeout = 120.0             # Timeout for providers without an explicit `timeout`
retry_max_attempts = 3              # LLM call retry budget (tenacity)
retry_min_wait = 5.0                # First retry backoff (seconds)
retry_max_wait = 60.0               # Retry backoff ceiling (seconds)
embedding_cache_ttl = 604800        # Embedding response-cache TTL (seconds; default 7d)
rerank_client_cap = 32              # Cached rerank clients ceiling (FIFO; safety bound)
# request_delay_enabled = false     # Global request throttling (per-provider override supported)
# request_delay_min = 1.0
# request_delay_max = 2.0

# ============================================================
# Provider: OpenAI
# ============================================================
[providers.openai]
type = "openai"
base_url = "https://api.openai.com/v1"
api_key = ""  # via WEAVER_LLM__PROVIDERS__OPENAI__API_KEY
rpm_limit = 2000
concurrency = 10
timeout = 120.0  # Omit to fall back to [global].default_timeout
priority = 100
weight = 100

[providers.openai.models.chat]
model_id = "gpt-4o"
temperature = 0.0
max_tokens = 4096
capabilities = ["chat", "vision"]

[providers.openai.models.embedding]
model_id = "text-embedding-3-large"
capabilities = ["embedding"]

# ============================================================
# Provider: Anthropic
# ============================================================
[providers.anthropic]
type = "anthropic"
base_url = ""                       # Use official endpoint
api_key = ""  # via WEAVER_LLM__PROVIDERS__ANTHROPIC__API_KEY
rpm_limit = 60
concurrency = 5
timeout = 300.0
priority = 100
weight = 100

[providers.anthropic.models.chat]
model_id = "claude-sonnet-4-20250514"
temperature = 0.0
max_tokens = 4096
capabilities = ["chat", "vision"]

# ============================================================
# Provider: Agnes AI (TESTING ONLY — OpenAI-compatible)
# 项目默认不使用 Agnes；仅本地/CI 测试时把 primary 标签切到
# chat.agnes.agnes-3.0-flash。文档: agnes-ai.com/docs/agnes-30-flash
# (512K context / max output 65,536 tokens; 免费档限流严格)
# ============================================================
[providers.agnes]
type = "openai"
base_url = "https://apihub.agnes-ai.com/v1"
api_key = ""  # via WEAVER_LLM__PROVIDERS__AGNES__API_KEY
rpm_limit = 20
concurrency = 2
timeout = 120.0
priority = 100
weight = 100

[providers.agnes.models.chat]
model_id = "agnes-3.0-flash"
temperature = 0.0
max_tokens = 4096
capabilities = ["chat"]

# ============================================================
# Provider: Ollama (Local) - Fallback for embedding
# ============================================================
[providers.ollama]
type = "openai"
base_url = "http://localhost:11434/v1"
api_key = "ollama"                  # Ollama does not require a real key
rpm_limit = 0                       # No rate limit for local
concurrency = 3
timeout = 300.0
priority = 200                      # Lower priority (higher number = lower priority)
weight = 50

[providers.ollama.models.embedding]
model_id = "nomic-embed-text"
capabilities = ["embedding"]

# ============================================================
# Default Labels (used when no call point specified)
# ============================================================
[defaults.chat]
label = "chat.openai.gpt-4o"
fallbacks = ["chat.anthropic.claude-sonnet-4-20250514"]

[defaults.embedding]
label = "embedding.openai.text-embedding-3-large"
fallbacks = ["embedding.ollama.nomic-embed-text"]

[defaults.rerank]
label = ""                          # Rerank requires specialized provider
fallbacks = []

# Per-call-point input truncation limits (characters), overriding the
# built-in defaults (classifier 600 / categorizer 1100 / quality_scorer
# 1500 / credibility_checker 2000 / analyze 3000 / analyze_narrative 8000 /
# summary 2000 / entity_extractor 2000 / default 2000). Only entries
# listed here override.
[input_limits]
classifier = 600
analyze = 3000

# ============================================================
# Call Point Routing (task-specific provider selection)
# Label format: {type}.{provider}.{model_id}
# Optional per-point keys: max_tokens, cache_ttl (response-cache TTL in
# seconds; omit to use the built-in per-call-point policy table)
# ============================================================
[call-points.classifier]
primary = "chat.openai.gpt-4o"
fallbacks = ["chat.anthropic.claude-sonnet-4-20250514"]

[call-points.cleaner]
primary = "chat.openai.gpt-4o"
fallbacks = ["chat.anthropic.claude-sonnet-4-20250514"]

[call-points.categorizer]
primary = "chat.openai.gpt-4o"
fallbacks = ["chat.anthropic.claude-sonnet-4-20250514"]

[call-points.analyze]
primary = "chat.openai.gpt-4o"
fallbacks = ["chat.anthropic.claude-sonnet-4-20250514"]

# analyze + narrative_schema 合并调用点（pipeline.toml
# merge_analyze_narrative=true 时启用）。输出 18 字段（含最长 4000 字的
# pattern），4096 上限会截断 → 双失，必须放宽到 8192。
[call-points.analyze_narrative]
primary = "chat.openai.gpt-4o"
fallbacks = ["chat.anthropic.claude-sonnet-4-20250514"]
max_tokens = 8192

[call-points.entity_extractor]
primary = "chat.openai.gpt-4o"
fallbacks = ["chat.anthropic.claude-sonnet-4-20250514"]

[call-points.credibility_checker]
primary = "chat.openai.gpt-4o"
fallbacks = ["chat.anthropic.claude-sonnet-4-20250514"]

[call-points.quality_scorer]
primary = "chat.openai.gpt-4o"
fallbacks = ["chat.anthropic.claude-sonnet-4-20250514"]

[call-points.merger]
primary = "chat.openai.gpt-4o"
fallbacks = ["chat.anthropic.claude-sonnet-4-20250514"]

[call-points.community_report]
primary = "chat.openai.gpt-4o"
fallbacks = []

[call-points.claim_extraction]
primary = "chat.openai.gpt-4o"
fallbacks = []

[call-points.narrative_schema]
primary = "chat.openai.gpt-4o"
fallbacks = ["chat.anthropic.claude-sonnet-4-20250514"]

[call-points.evidence_sampling]
primary = "chat.openai.gpt-4o"
fallbacks = ["chat.anthropic.claude-sonnet-4-20250514"]

[call-points.embedding]
primary = "embedding.openai.text-embedding-3-large"
fallbacks = ["embedding.ollama.nomic-embed-text"]

# ============================================================
# Smart Router Configuration (optional)
# ============================================================
# Controls dynamic model selection scoring per call point.
# If not set, falls back to static primary/fallback chain above.
# ============================================================

[routing.classifier]
mode = "auto"                      # auto | fast | best

[routing.classifier.weights]
editorial = 0.35                 # Preset priority from TOML order
reliability = 0.25               # Historical success rate
cost = 0.15                      # Estimated token cost
latency = 0.10                   # Historical P50 latency

[routing.classifier.bandit]
enabled = true
exploration_weight = 0.15        # Thompson Sampling exploration
warmup_calls = 3                 # Min calls before stats are trusted

[routing.entity_extractor]
mode = "best"                      # Quality-first for extraction tasks

[routing.embedding]
mode = "fast"                      # Cost-first for embedding tasks

# ============================================================
# Shadow Evaluation (optional, default: disabled)
# ============================================================
# Parallel send requests to candidate models for A/B comparison.
# Does NOT affect the main call path.
# ============================================================

[eval]
enabled = false                    # Enable shadow evaluation
sample_rate = 0.1                  # 10% of requests trigger shadow calls
target_call_points = ["classifier", "entity_extractor"]
baseline_model = "chat.openai.gpt-4o"
candidate_models = ["chat.anthropic.claude-sonnet-4-20250514"]

# ============================================================
# Cost Rates (USD per 1K tokens)
# ============================================================
# OpenAI gpt-4o 刊例价（$2.50/1M input, $10.00/1M output, cached $1.25/1M
# → cached 比例 0.5）。接入其他 provider 时按其官网刊例填写，禁止编造。
[cost.rates."chat.openai.gpt-4o"]
input = 0.0025
output = 0.01
cached = 0.5

# Agnes 免费档：官方刊例 $0.05/$0.15（每百万），当前优惠价均为 $0。
# cached 为缓存命中价占 input 价的折扣比例（刊例 0.005/0.05 = 0.1）；
# 优惠期内 input/output 已为 0，cached 比例不产生实际成本。
[cost.rates."chat.agnes.agnes-3.0-flash"]
input = 0.0
output = 0.0
cached = 0.1
