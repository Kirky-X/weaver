# 自定义地区映射扩展
# 用于补充 pycountry/geonamescache 未覆盖的映射

aliases:
  # 特殊地区处理
  special_cases:
    - name: "台湾"
      map_to: "CN"
      canonical: "中国台湾"

    - name: "香港"
      map_to: "HK"
      canonical: "香港"

    - name: "澳门"
      map_to: "MO"
      canonical: "澳门"

# 层级关系扩展
hierarchy:
  "亚洲":
    type: continent
    contains:
      - "CN"
      - "JP"
      - "KR"
      - "IN"

  "欧洲":
    type: continent
    contains:
      - "GB"
      - "DE"
      - "FR"
      - "IT"
