# Weaver Release：tag (v*) → 构建 sdist+wheel → GitHub Release
# PyPI 发布跳过（weaver 为私有项目，未配置 UV_PUBLISH_TOKEN）
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras --all-groups
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create Release with sdist/wheel
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
