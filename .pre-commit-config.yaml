# ============================================================
# .pre-commit-config.yaml
# Weaver 项目 - 工业级代码质量检查配置
# Python 3.12 | FastAPI | SQLAlchemy | Neo4j | Redis | spaCy
# ============================================================
#
# 安装步骤:
#   1. 安装开发依赖:              uv sync --all-groups
#   2. 安装 git hook 脚本:        pre-commit install
#   3. 首次运行所有 hook:         pre-commit run --all-files
#
# 跳过特定 hook（不跳过整个验证，遵守规则 18）:
#   SKIP=ruff git commit -m "..."
#
# ============================================================

ci:
  autoupdate_schedule: monthly

default_install_hook_types:
  - pre-commit

default_stages:
  - pre-commit

repos:
  # ==========================================================
  # 0. 基础设施检查
  # ==========================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [ --markdown-linebreak-ext=md ]
      - id: end-of-file-fixer
        types: [ python, yaml, toml, markdown, json, shell ]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
        args: [ '--assume-in-merge' ]
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [ --fix=lf ]
      - id: check-added-large-files
        args: [ '--maxkb=2048' ]

  # ==========================================================
  # 1. 本地工具调用（使用已安装的工具，避免网络下载）
  # ==========================================================

  # isort — import 排序
  - repo: local
    hooks:
      - id: isort
        name: isort (local)
        entry: isort
        language: system
        types: [ python ]
        args:
          - --settings-path=pyproject.toml
          - --filter-files
        files: ^src/|^tests/|^scripts/

  # ruff — linter + fix (replaces black, single source of truth for formatting)
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (check)
        entry: ruff
        language: system
        types: [ python ]
        args:
          - format
          - --config=pyproject.toml
          - --check
          - --exit-non-zero-on-fix
        files: ^src/|^tests/|^scripts/
        pass_filenames: true
      - id: ruff
        name: ruff (linter)
        entry: ruff
        language: system
        types: [ python ]
        args:
          - check
          - --config=pyproject.toml
          - --fix
          - --exit-non-zero-on-fix
        files: ^src/|^tests/|^scripts/
        pass_filenames: true

  # mypy — 静态类型检查（暂不启用，待完善类型注解）
  # - repo: local
  #   hooks:
  #     - id: mypy
  #       name: mypy (local)
  #       entry: mypy
  #       language: system
  #       types: [python]
  #       args:
  #         - --config-file=pyproject.toml
  #         - --show-error-codes
  #       files: ^src/api/
  #       pass_filenames: true

  # bandit — 安全漏洞扫描（可选，手动运行）
  # - repo: local
  #   hooks:
  #     - id: bandit
  #       name: bandit (local)
  #       entry: bandit
  #       language: system
  #       types: [python]
  #       args:
  #         - -r
  #         - -ll
  #         - src
  #       files: ^src/
  #       pass_filenames: false

  # ==========================================================
  # 2. 日志规范检查（禁止使用 logging.getLogger）
  # ==========================================================
  - repo: local
    hooks:
      - id: check-logging-usage
        name: check-logging-usage (禁止 logging.getLogger)
        entry: python scripts/tools.py check-logging
        language: system
        types: [ python ]
        files: ^src/|^tests/|^scripts/
        pass_filenames: true