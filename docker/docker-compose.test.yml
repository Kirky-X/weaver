# Weaver API Acceptance Test Stack
# Usage: docker compose -f docker/docker-compose.test.yml up -d
# Stop:  docker compose -f docker/docker-compose.test.yml down
# Clean: docker compose -f docker/docker-compose.test.yml down -v
#
# Phase 1 测试栈：PostgreSQL (pgvector) + Neo4j + Redis
# 配置与 config/settings.toml 和 .env 一致。

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: weaver_test_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: weavertest
      POSTGRES_DB: weaver
    ports:
      - "5432:5432"
    volumes:
      - weaver_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weaver"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weaver_test

  neo4j:
    image: neo4j:5.25
    container_name: weaver_test_neo4j
    environment:
      NEO4J_AUTH: neo4j/weavertest
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1g
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - weaver_neo4j_data:/data
      - weaver_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - weaver_test

  redis:
    image: redis:7-alpine
    container_name: weaver_test_redis
    ports:
      - "6379:6379"
    volumes:
      - weaver_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - weaver_test

volumes:
  weaver_pg_data:
  weaver_neo4j_data:
  weaver_neo4j_logs:
  weaver_redis_data:

networks:
  weaver_test:
    driver: bridge
