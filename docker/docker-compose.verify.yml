# Weaver Multi-Instance Verification Stack
# Usage: docker compose -f docker/docker-compose.verify.yml up -d
# Stop:  docker compose -f docker/docker-compose.verify.yml down
# Clean: docker compose -f docker/docker-compose.verify.yml down -v
#
# Phase H 验证栈：第二组 PG + Neo4j 实例，用于 T035 反向导入验证。
# 端口与 docker-compose.test.yml 错开：PG2=5433、Neo4j2 HTTP=7475/Bolt=7688。
# Redis 复用 test 栈的 6379，不重复部署。

services:
  postgres2:
    image: pgvector/pgvector:pg16
    container_name: weaver_verify_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: weavertest
      POSTGRES_DB: weaver
    ports:
      - "5433:5432"
    volumes:
      - weaver_pg2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weaver"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weaver_verify

  neo4j2:
    image: neo4j:5.25
    container_name: weaver_verify_neo4j
    environment:
      NEO4J_AUTH: neo4j/weavertest
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1g
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - weaver_neo4j2_data:/data
      - weaver_neo4j2_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - weaver_verify

volumes:
  weaver_pg2_data:
  weaver_neo4j2_data:
  weaver_neo4j2_logs:

networks:
  weaver_verify:
    driver: bridge
