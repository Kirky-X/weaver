# Weaver Infrastructure Services
# Usage: docker compose up -d
# Stop:  docker compose down
# Clean: docker compose down -v
#
# Environment Variable Format:
# - Prefix: WEAVER_ (single underscore)
# - Nested delimiter: __ (double underscore)
# - Example: WEAVER_POSTGRES__PASSWORD=secret
#
# Set these in .env file or export them before running docker compose.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: weaver_postgres
    environment:
      POSTGRES_USER: ${WEAVER_POSTGRES__USER:-postgres}
      POSTGRES_PASSWORD: ${WEAVER_POSTGRES__PASSWORD:-invalid}
      POSTGRES_DB: ${WEAVER_POSTGRES__DATABASE:-weaver}
    ports:
      - "${WEAVER_POSTGRES__PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${WEAVER_POSTGRES__USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weaver

  neo4j:
    image: neo4j:5.25
    container_name: weaver_neo4j
    environment:
      NEO4J_AUTH: ${WEAVER_NEO4J__USER:-neo4j}/${WEAVER_NEO4J__PASSWORD:-weavertest}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1g
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - weaver

  redis:
    image: redis:7.2-alpine
    container_name: weaver_redis
    ports:
      - "${WEAVER_REDIS__PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - weaver

  # Full application stack: docker compose --profile full up -d
  # Runs migrations, then starts the API. Hosts default to the compose
  # service names; override via WEAVER_* env vars in .env.
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles: [ "full" ]
    container_name: weaver_app
    environment:
      WEAVER_POSTGRES__HOST: postgres
      WEAVER_NEO4J__HOST: neo4j
      WEAVER_REDIS__HOST: redis
    env_file:
      - path: ../.env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ../config:/app/config:ro
      - ../alembic.ini:/app/alembic.ini:ro
      - ../data:/app/data
    command:
      - sh
      - -c
      - |
        uv run alembic upgrade head
        exec uv run uvicorn src.main:get_app --factory --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - weaver

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:

networks:
  weaver:
    driver: bridge
