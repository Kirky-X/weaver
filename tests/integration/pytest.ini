# 集成测试专用 pytest 配置。
#
# 使用方式：
#   cd tests/integration && pytest -c pytest.ini
# 或从项目根目录：
#   uv run pytest tests/integration/ -c tests/integration/pytest.ini -m integration
#
# 与 pyproject.toml [tool.pytest.ini_options] 的关系：
# - markers / asyncio_mode / pythonpath 继承自 pyproject.toml + conftest.py
#   的 pytest_configure hook（已注册 db_combo / bing_live / db_failover / slow）。
# - 本文件仅覆盖集成测试层独有的 addopts：覆盖率范围限定为 src/api（85% 门禁），
#   并取消默认的 `-m "not integration..."` 过滤，使集成测试默认被收集。
# - 禁用 xdist（不使用 -n 2）：DuckDB 单写者约束下，多 worker 打开同一
#   DuckDB 文件会触发 IOException 锁冲突。session 级 async_client fixture
#   在每个 worker 中独立启动 lifespan，各自打开同一 DuckDB 文件 → 锁冲突。
#   单进程串行运行避免此问题（见 project_memory.md DuckDB 教训）。
[pytest]
testpaths = .
pythonpath = ../../src
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts =
    --strict-markers
    --strict-config
    --tb=short
    -ra
    --color=yes
    --timeout=300
    --timeout-method=thread
    --cov=src/api
    --cov-report=term-missing
    --cov-fail-under=85
    -m integration
markers =
    integration: Integration tests requiring external services
    e2e: End-to-end tests
    slow: Slow-running tests (Deep phase)
    performance: Performance benchmark tests
    benchmark: pytest-benchmark fixture tests (skip in CI)
    unit: mark test as unit test
    db_combo: 4 套 DB 组合矩阵测试
    bing_live: 真实 Bing 网络调用测试
    db_failover: 数据库故障转移测试
filterwarnings =
    ignore:The pynvml package is deprecated:FutureWarning:torch.cuda
    ignore:Can't initialize NVML:UserWarning:torch.cuda
    ignore:`torch.jit.script` is deprecated:DeprecationWarning:torch.jit
    ignore:Stealth has already been applied:UserWarning:playwright_stealth
    ignore:coroutine.*was never awaited:RuntimeWarning
    ignore:Please import.*from.*scipy.sparse:DeprecationWarning:scipy.sparse.construct
    ignore:The keyword argument.*nopython.*:DeprecationWarning:numba
    ignore:builtin type.*has no __module__:DeprecationWarning
    ignore:There is no current event loop:DeprecationWarning
